name: VF Forge Phase3 Runtime Extractor

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/vf-forge-phase3-runtime.yml'

permissions:
  contents: read

jobs:
  extract-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Debian 13 PHP runtime packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-runtime
          docker run --rm -v "$PWD/phase3-runtime:/out" debian:trixie bash -lc '
            set -euo pipefail
            apt-get update
            cd /out
            apt-get download php8.4-sqlite3 php8.4-curl php8.4-zip
            sha256sum *.deb > SHA256SUMS.txt
            dpkg-deb -f php8.4-sqlite3_*.deb Package Version Architecture > sqlite-package.txt
            dpkg-deb -f php8.4-curl_*.deb Package Version Architecture > curl-package.txt
            dpkg-deb -f php8.4-zip_*.deb Package Version Architecture > zip-package.txt
          '
      - name: Upload temporary runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-phase3-runtime
          path: phase3-runtime/
          if-no-files-found: error
          retention-days: 1
