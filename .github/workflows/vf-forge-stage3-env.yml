name: VF Forge Stage3 Public Probe

on:
  push:
    branches:
      - vf-forge-stage3-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe current public forge.kewaro.com
        shell: bash
        run: |
          set -u
          BASE='https://forge.kewaro.com'
          mkdir -p public-probe
          : > public-probe/summary.txt
          : > public-probe/path-status.txt

          getent ahostsv4 forge.kewaro.com | tee public-probe/dns.txt || true
          DNS_OK=0; test -s public-probe/dns.txt && DNS_OK=1

          fetch() {
            name="$1"; url="$2"
            curl -sS --retry 2 --connect-timeout 10 --max-time 30 \
              -o "public-probe/${name}.body" -D "public-probe/${name}.headers" \
              -w '%{http_code}' "$url" || printf 000
          }

          ROOT_STATUS="$(fetch root "$BASE/")"
          INDEX_HTML_STATUS="$(fetch index-html "$BASE/index.html")"
          INDEX_PHP_STATUS="$(fetch index-php "$BASE/index.php")"
          SETUP_STATUS="$(fetch setup "$BASE/setup.php")"
          API_STATUS="$(fetch api-session "$BASE/api.php?action=session")"
          DIAGNOSE_STATUS="$(fetch diagnose "$BASE/diagnose.php")"
          VERSION_STATUS="$(fetch version "$BASE/VERSION.txt")"
          MANIFEST_STATUS="$(fetch manifest "$BASE/release-manifest.json")"
          SCHEMA_STATUS="$(fetch schema "$BASE/app/schema.sql")"

          grep -Eai '^(content-security-policy|x-content-type-options|referrer-policy|x-frame-options|x-robots-tag|x-vf-forge-nginx-hardening|server|cf-ray):' public-probe/root.headers > public-probe/security-headers.txt || true
          grep -Eio '<title>[^<]*</title>' public-probe/root.body > public-probe/root-title.txt || true
          grep -Eio '<title>[^<]*</title>' public-probe/index-php.body > public-probe/index-php-title.txt || true
          grep -Ein 'robots|noindex|nofollow|VF Forge|VF AssetBox|1\.[0-9]+\.[0-9]+' public-probe/index-php.body | head -80 > public-probe/index-php-signals.txt || true
          APP_SIGNATURE=0
          if grep -Eqi 'VF Forge|VF AssetBox' public-probe/index-php.body; then APP_SIGNATURE=1; fi
          HARDENING_MARKER=0
          if grep -Eqi '^x-vf-forge-nginx-hardening:[[:space:]]*20260808-r1' public-probe/root.headers; then HARDENING_MARKER=1; fi
          NOINDEX_OK=0
          if grep -Eqi 'noindex|nofollow' public-probe/root.body || grep -Eqi '^x-robots-tag:.*noindex' public-probe/root.headers; then NOINDEX_OK=1; fi
          INDEX_PHP_NOINDEX=0
          if grep -Eqi 'noindex|nofollow' public-probe/index-php.body || grep -Eqi '^x-robots-tag:.*noindex' public-probe/index-php.headers; then INDEX_PHP_NOINDEX=1; fi
          CSP_OK=0; grep -Eqi '^content-security-policy:' public-probe/root.headers && CSP_OK=1
          INDEX_PHP_CSP=0; grep -Eqi '^content-security-policy:' public-probe/index-php.headers && INDEX_PHP_CSP=1

          ROBOTS_STATUS="$(fetch robots "$BASE/robots.txt")"
          ROBOTS_DISALLOW=0; grep -Eqi '^Disallow:[[:space:]]*/[[:space:]]*$' public-probe/robots.body && ROBOTS_DISALLOW=1
          SESSION_UNAUTH=0; grep -Eq '"authenticated"[[:space:]]*:[[:space:]]*false' public-probe/api-session.body && SESSION_UNAUTH=1

          printf 'version_status=%s\n' "$VERSION_STATUS" > public-probe/exposed-content.txt
          if [ "$VERSION_STATUS" = 200 ]; then printf 'version_body=' >> public-probe/exposed-content.txt; head -c 120 public-probe/version.body >> public-probe/exposed-content.txt; printf '\n' >> public-probe/exposed-content.txt; fi
          printf 'manifest_status=%s\n' "$MANIFEST_STATUS" >> public-probe/exposed-content.txt
          if [ "$MANIFEST_STATUS" = 200 ]; then grep -E '"version"|"schema_version"|"package_profile"' public-probe/manifest.body | head -20 >> public-probe/exposed-content.txt || true; fi
          printf 'schema_status=%s schema_bytes=%s\n' "$SCHEMA_STATUS" "$(wc -c < public-probe/schema.body 2>/dev/null || echo 0)" >> public-probe/exposed-content.txt
          if [ "$SCHEMA_STATUS" = 200 ]; then head -20 public-probe/schema.body >> public-probe/exposed-content.txt; fi

          EXPOSURES=0
          for p in \
            '/app/schema.sql' \
            '/release-manifest.json' \
            '/VERSION.txt' \
            '/FULL-PACKAGE-NOTES.txt' \
            '/DEPLOY-HERE.txt' \
            '/docs/VF_Forge_Web_%E5%AE%8C%E6%95%B4%E9%9C%80%E6%B1%82%E4%B8%8E%E5%BC%80%E5%8F%91%E6%8E%A5%E7%BB%ADSSOT_R2026.08.07_COMPLETE.md'
          do
            code="$(curl -sS --retry 1 --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$BASE$p" || printf 000)"
            printf '%s %s\n' "$code" "$p" | tee -a public-probe/path-status.txt
            case "$code" in 403|404|410) ;; *) EXPOSURES=$((EXPOSURES+1));; esac
          done

          {
            echo "DNS_OK=$DNS_OK"
            echo "ROOT_STATUS=$ROOT_STATUS"
            echo "INDEX_HTML_STATUS=$INDEX_HTML_STATUS"
            echo "INDEX_PHP_STATUS=$INDEX_PHP_STATUS"
            echo "SETUP_STATUS=$SETUP_STATUS"
            echo "API_STATUS=$API_STATUS"
            echo "DIAGNOSE_STATUS=$DIAGNOSE_STATUS"
            echo "APP_SIGNATURE=$APP_SIGNATURE"
            echo "HARDENING_MARKER=$HARDENING_MARKER"
            echo "NOINDEX_OK=$NOINDEX_OK"
            echo "INDEX_PHP_NOINDEX=$INDEX_PHP_NOINDEX"
            echo "CSP_OK=$CSP_OK"
            echo "INDEX_PHP_CSP=$INDEX_PHP_CSP"
            echo "ROBOTS_STATUS=$ROBOTS_STATUS"
            echo "ROBOTS_DISALLOW=$ROBOTS_DISALLOW"
            echo "SESSION_UNAUTH=$SESSION_UNAUTH"
            echo "VERSION_STATUS=$VERSION_STATUS"
            echo "MANIFEST_STATUS=$MANIFEST_STATUS"
            echo "SCHEMA_STATUS=$SCHEMA_STATUS"
            echo "PUBLIC_PATH_EXPOSURES=$EXPOSURES"
          } | tee public-probe/summary.txt

      - name: Upload public probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-public-probe-detail
          path: public-probe/
          if-no-files-found: error
          retention-days: 1

      - name: Report probe outcome
        if: always()
        shell: bash
        run: |
          cat public-probe/summary.txt
          echo '=== exposed content ==='
          cat public-probe/exposed-content.txt || true
