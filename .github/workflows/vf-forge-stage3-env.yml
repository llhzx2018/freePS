name: VF Forge Stage3 Public Probe

on:
  push:
    branches:
      - vf-forge-stage3-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe current public forge.kewaro.com
        id: probe
        shell: bash
        run: |
          set -u
          BASE='https://forge.kewaro.com'
          mkdir -p public-probe
          : > public-probe/summary.txt
          : > public-probe/path-status.txt

          getent ahostsv4 forge.kewaro.com | tee public-probe/dns.txt || true
          DNS_OK=0; test -s public-probe/dns.txt && DNS_OK=1

          ROOT_STATUS="$(curl -sS --retry 2 --connect-timeout 10 --max-time 30 -o public-probe/root.html -D public-probe/root.headers -w '%{http_code}' "$BASE/" || printf 000)"
          grep -Eai '^(content-security-policy|x-content-type-options|referrer-policy|x-frame-options|x-robots-tag|server|cf-ray):' public-probe/root.headers > public-probe/security-headers.txt || true
          grep -Eio '<title>[^<]*</title>' public-probe/root.html > public-probe/title.txt || true
          grep -Ein 'robots|noindex|nofollow|VF Forge|VF AssetBox|1\.[0-9]+\.[0-9]+' public-probe/root.html | head -80 > public-probe/root-signals.txt || true
          NOINDEX_OK=0
          if grep -Eqi 'noindex|nofollow' public-probe/root.html || grep -Eqi '^x-robots-tag:.*noindex' public-probe/root.headers; then NOINDEX_OK=1; fi
          CSP_OK=0; grep -Eqi '^content-security-policy:' public-probe/root.headers && CSP_OK=1

          ROBOTS_STATUS="$(curl -sS --retry 2 --connect-timeout 10 --max-time 30 -o public-probe/robots.txt -w '%{http_code}' "$BASE/robots.txt" || printf 000)"
          ROBOTS_DISALLOW=0; grep -Eqi '^Disallow:[[:space:]]*/[[:space:]]*$' public-probe/robots.txt && ROBOTS_DISALLOW=1

          SESSION_STATUS="$(curl -sS --retry 2 --connect-timeout 10 --max-time 30 -o public-probe/session.json -D public-probe/session.headers -w '%{http_code}' "$BASE/api.php?action=session" || printf 000)"
          SESSION_UNAUTH=0; grep -Eq '"authenticated"[[:space:]]*:[[:space:]]*false' public-probe/session.json && SESSION_UNAUTH=1

          EXPOSURES=0
          for p in \
            '/app/schema.sql' \
            '/app/bootstrap.php' \
            '/cli/verify.php' \
            '/release-manifest.json' \
            '/VERSION.txt' \
            '/FULL-PACKAGE-NOTES.txt' \
            '/DEPLOY-HERE.txt' \
            '/.runtime.php' \
            '/docs/VF_Forge_Web_%E5%AE%8C%E6%95%B4%E9%9C%80%E6%B1%82%E4%B8%8E%E5%BC%80%E5%8F%91%E6%8E%A5%E7%BB%ADSSOT_R2026.08.07_COMPLETE.md'
          do
            code="$(curl -sS --retry 1 --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$BASE$p" || printf 000)"
            printf '%s %s\n' "$code" "$p" | tee -a public-probe/path-status.txt
            case "$code" in 403|404|410) ;; *) EXPOSURES=$((EXPOSURES+1));; esac
          done

          {
            echo "DNS_OK=$DNS_OK"
            echo "ROOT_STATUS=$ROOT_STATUS"
            echo "NOINDEX_OK=$NOINDEX_OK"
            echo "CSP_OK=$CSP_OK"
            echo "ROBOTS_STATUS=$ROBOTS_STATUS"
            echo "ROBOTS_DISALLOW=$ROBOTS_DISALLOW"
            echo "SESSION_STATUS=$SESSION_STATUS"
            echo "SESSION_UNAUTH=$SESSION_UNAUTH"
            echo "PUBLIC_PATH_EXPOSURES=$EXPOSURES"
          } | tee public-probe/summary.txt

      - name: Upload public probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-public-probe
          path: public-probe/
          if-no-files-found: error
          retention-days: 1

      - name: Evaluate public probe
        shell: bash
        run: |
          set -euo pipefail
          source public-probe/summary.txt
          test "$DNS_OK" = 1
          case "$ROOT_STATUS" in 200|301|302|303|307|308) ;; *) exit 31;; esac
          test "$NOINDEX_OK" = 1
          test "$ROBOTS_STATUS" = 200
          test "$ROBOTS_DISALLOW" = 1
          test "$SESSION_STATUS" = 200
          test "$SESSION_UNAUTH" = 1
          test "$PUBLIC_PATH_EXPOSURES" = 0
          echo 'VF_FORGE_PUBLIC_PROBE=PASS'
