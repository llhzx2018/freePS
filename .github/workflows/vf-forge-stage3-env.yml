name: VF Forge Stage3 Environment

on:
  push:
    branches:
      - vf-forge-stage3-e2e
    paths-ignore:
      - 'vf-forge-stage3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, zip, mbstring, fileinfo, openssl
          coverage: none

      - name: Install real-environment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 nginx

      - name: Verify VF Forge Phase 3 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PHP ==='
          php -v
          test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = '8.2'
          echo '=== PDO drivers ==='
          php -r '$d=PDO::getAvailableDrivers(); echo json_encode($d), PHP_EOL; if(!in_array("sqlite",$d,true)) exit(21);'
          echo '=== Required extensions ==='
          php -r '$required=["pdo_sqlite","sqlite3","zip","fileinfo","openssl","mbstring","json","session"]; foreach($required as $e){echo $e,"=",extension_loaded($e)?"PASS":"FAIL",PHP_EOL;if(!extension_loaded($e))exit(22);}'
          php -r 'echo "ZipArchive=",class_exists("ZipArchive")?"PASS":"FAIL",PHP_EOL; if(!class_exists("ZipArchive")) exit(23);'
          echo '=== SQLite CLI ==='
          sqlite3 --version
          echo '=== tar ==='
          tar --version | head -1
          echo '=== OPcache ==='
          php -d opcache.enable_cli=1 -r 'echo "Zend OPcache=",extension_loaded("Zend OPcache")?"PASS":"FAIL",PHP_EOL; if(!extension_loaded("Zend OPcache")) exit(24);'
          echo '=== Nginx ==='
          nginx -v
          echo '=== Browser ==='
          (google-chrome --version || chromium --version || chromium-browser --version)
          echo 'VF_FORGE_STAGE3_ENVIRONMENT=PASS'

      - name: Build portable PHP 8.2 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-artifact
          curl -L --retry 3 --fail \
            https://raw.githubusercontent.com/NativePHP/php-bin/0.6.1/bin/linux/x64/php-8.2.zip \
            -o runtime-artifact/php-8.2.zip
          sha256sum runtime-artifact/php-8.2.zip | tee runtime-artifact/SHA256SUMS

      - name: Upload portable PHP 8.2 runtime
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-php82-runtime
          path: runtime-artifact/
          if-no-files-found: error
          retention-days: 1

      - name: Build portable Chrome artifact
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          REAL_BIN="$(readlink -f "$CHROME_BIN")"
          CHROME_DIR="$(dirname "$REAL_BIN")"
          echo "chrome_bin=$CHROME_BIN"
          echo "real_bin=$REAL_BIN"
          echo "chrome_dir=$CHROME_DIR"
          "$CHROME_BIN" --version
          mkdir -p chrome-artifact
          tar -C "$(dirname "$CHROME_DIR")" -czf chrome-artifact/chrome-runtime.tar.gz "$(basename "$CHROME_DIR")"
          printf '%s\n' "$REAL_BIN" > chrome-artifact/ORIGINAL_PATH.txt
          sha256sum chrome-artifact/chrome-runtime.tar.gz | tee chrome-artifact/SHA256SUMS
          du -h chrome-artifact/chrome-runtime.tar.gz

      - name: Upload portable Chrome runtime
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-chrome-runtime
          path: chrome-artifact/
          if-no-files-found: error
          retention-days: 1
