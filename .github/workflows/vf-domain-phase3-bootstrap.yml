name: VF Domain Phase3 Bootstrap Packages

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-debian-packages:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official Debian 13 packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/out"
          docker run --rm -v "$PWD/out:/out" debian:trixie-slim bash -lc '
            set -euo pipefail
            apt-get update
            PHP_VER="8.4.16-1~deb13u1"
            apt-get download \
              "php8.4-sqlite3=${PHP_VER}" \
              "php8.4-curl=${PHP_VER}" \
              "php8.4-zip=${PHP_VER}" \
              sqlite3 \
              libsqlite3-0 \
              libzip5
            mv ./*.deb /out/
          '
          cd out
          sha256sum *.deb | sort -k2 > SHA256SUMS.txt
          dpkg-deb -f php8.4-sqlite3_*.deb Package Version Architecture
          dpkg-deb -f php8.4-curl_*.deb Package Version Architecture
          dpkg-deb -f php8.4-zip_*.deb Package Version Architecture
          dpkg-deb -f sqlite3_*.deb Package Version Architecture
          dpkg-deb -f libsqlite3-0_*.deb Package Version Architecture
          dpkg-deb -f libzip5_*.deb Package Version Architecture

      - name: Upload package bundle
        uses: actions/upload-artifact@v4
        with:
          name: vf-domain-phase3-debian13-php84-modules
          path: out/
          if-no-files-found: error
          retention-days: 1
