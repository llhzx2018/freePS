name: VF Domain Phase3 Bootstrap Packages

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-debian-packages:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Debian 13 packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/out"
          docker run --rm -v "$PWD/out:/out" debian:trixie-slim bash -lc '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl

            BASE="https://cermin.rumahweb.id/debian-security/pool/updates/main/p/php8.4"
            VER="8.4.16-1~deb13u1"
            for MOD in sqlite3 curl zip; do
              curl -fL --retry 3 --retry-delay 2 \
                "$BASE/php8.4-${MOD}_${VER}_amd64.deb" \
                -o "/out/php8.4-${MOD}_${VER}_amd64.deb"
            done

            mkdir -p /tmp/debs && cd /tmp/debs
            apt-get download sqlite3 libsqlite3-0 libzip5
            mv ./*.deb /out/
          '

          cd out
          sha256sum *.deb | sort -k2 > SHA256SUMS.txt
          dpkg-deb -f php8.4-sqlite3_*.deb Package Version Architecture Depends
          dpkg-deb -f php8.4-curl_*.deb Package Version Architecture Depends
          dpkg-deb -f php8.4-zip_*.deb Package Version Architecture Depends
          dpkg-deb -f sqlite3_*.deb Package Version Architecture Depends
          dpkg-deb -f libsqlite3-0_*.deb Package Version Architecture Depends
          dpkg-deb -f libzip5_*.deb Package Version Architecture Depends

      - name: Upload package bundle
        uses: actions/upload-artifact@v4
        with:
          name: vf-domain-phase3-debian13-php84-modules
          path: out/
          if-no-files-found: error
          retention-days: 1
